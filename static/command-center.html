<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doshie Command Center</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}
body{margin:0;background:#070b10;color:#e8f1ff;min-height:100vh}
.app-shell{max-width:900px;margin:auto;padding:32px}
h1{font-size:32px;margin-bottom:30px}
.card{background:#111923;border:1px solid #26364a;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 10px 30px #0006}
h2{color:#62d9ff;margin-top:0}
.status{display:flex;gap:12px;flex-wrap:wrap}
.badge{background:#123b2a;color:#7dffb0;padding:8px 14px;border-radius:999px}
a{color:#62d9ff}
</style>
</head>
<body>
<main class="app-shell">
<h1>🦖 Doshie Command Center</h1>
<div class="card">
<h2>🧠 Brain Status</h2>
<div class="status"><span class="badge">Advanced: qwen3.5:9b</span><span class="badge">Coding: qwen2.5-coder:7b</span></div>
</div>
<div class="card">
<h2>⚙️ Modules</h2>
<ul><li>📚 Memory</li><li>🔧 Tools</li><li>🌐 Web</li><li>🎙️ Voice</li><li>👁️ Vision</li></ul>
</div>
<a href="/">← Back</a>
</main>
</body>
</html>
