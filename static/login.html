<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Doshie AI • Secure Workstation Login</title>
<style>
  :root {
    --accent: #10b981;
    --accent-light: #6ee7b7;
    --bg-dark: #040d07;
    --card-dark: #0d2218;
    --border-dark: #1b432f;
  }
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #040d07;
    color: #f0fdf4;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.25rem 1rem;
    position: relative;
    overflow-y: auto;
  }
  .ambient-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: blur(90px);
    z-index: 1;
  }
  .lock-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    margin: auto;
    background: rgba(13, 34, 24, 0.94);
    border: 1px solid var(--border-dark);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    padding: 2rem 1.75rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    text-align: center;
  }
  .clock {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 3rem;
    font-weight: 300;
    letter-spacing: -1px;
    margin-bottom: 0.2rem;
    color: #ffffff;
  }
  .date {
    font-size: 0.82rem;
    color: var(--accent-light);
    opacity: 0.9;
    margin-bottom: 1.25rem;
    font-weight: 500;
  }
  .title-area {
    margin-bottom: 1.25rem;
  }
  .title-area h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    color: #ffffff;
  }
  .title-area p {
    font-size: 0.82rem;
    color: #9ca3af;
    line-height: 1.45;
  }
  .profiles-row {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.6rem;
    margin-bottom: 1.2rem;
    scrollbar-width: thin;
    scrollbar-color: #1b432f transparent;
  }
  .profile-chip {
    flex: 1;
    min-width: 85px;
    padding: 0.65rem 0.5rem;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e5e7eb;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    user-select: none;
  }
  .profile-chip:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  .profile-chip.active {
    background: rgba(16, 185, 129, 0.25);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.35);
  }
  .profile-chip .avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, #059669, #10b981);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #fff;
    font-size: 0.85rem;
  }
  .form-group {
    text-align: left;
    margin-bottom: 1rem;
    position: relative;
  }
  .form-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-light);
    margin-bottom: 0.35rem;
  }
  .form-group .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid var(--border-dark);
    color: #fff;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
  }
  .form-group input::placeholder {
    color: rgba(110, 231, 183, 0.45);
  }
  .toggle-pwd-btn {
    position: absolute;
    right: 0.75rem;
    background: transparent;
    border: none;
    color: #6ee7b7;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    opacity: 0.8;
  }
  .toggle-pwd-btn:hover {
    opacity: 1;
    background: rgba(255,255,255,0.08);
  }
  button.submit-btn {
    width: 100%;
    padding: 0.85rem;
    border-radius: 14px;
    background: #059669;
    border: none;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  button.submit-btn:hover { background: #10b981; }
  button.submit-btn:active { transform: scale(0.98); }
  #status {
    font-size: 0.8rem;
    color: #f87171;
    margin-top: 0.75rem;
    min-height: 1.2rem;
    font-weight: 500;
  }
  #status.success {
    color: #34d399;
  }
  .footer-badge {
    margin-top: 1.25rem;
    font-size: 0.75rem;
    color: #6ee7b7;
    opacity: 0.8;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div class="ambient-glow" id="glow"></div>

<main class="lock-card">
  <div class="clock" id="clock">12:00:00</div>
  <div class="date" id="date">Friday, September 18, 2026</div>

  <div class="title-area">
    <h1 id="title-text"><span>🦖</span> <span id="custom-title">Doshie Workstation</span></h1>
    <p id="custom-subtitle">Private local AI environment secured. Select profile to unlock.</p>
  </div>

  <div class="profiles-row" id="profiles-container">
    <div class="profile-chip active" onclick="selectProfile('Hermes')">
      <div class="avatar">H</div>
      <span>Hermes</span>
    </div>
  </div>

  <datalist id="profile-suggestions"></datalist>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="profile">
        <span>Profile Name</span>
        <span style="font-size: 0.68rem; font-weight: normal; opacity: 0.8; text-transform: none;">(Type or select above)</span>
      </label>
      <input
        id="profile"
        type="text"
        value="Hermes"
        list="profile-suggestions"
        placeholder="Type profile name (e.g. Hermes)"
        autocomplete="username"
        autocapitalize="words"
        oninput="handleProfileInput(this.value)"
        required
      >
    </div>

    <div class="form-group">
      <label for="credential">
        <span>PIN or Password</span>
        <span style="font-size: 0.68rem; font-weight: normal; opacity: 0.8; text-transform: none;">(Required)</span>
      </label>
      <div class="input-wrapper">
        <input
          id="credential"
          type="password"
          placeholder="Enter PIN code or password"
          autocomplete="current-password"
          required
        >
        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
          👁
        </button>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">
      <span>🔓</span>
      <span id="btn-text">Unlock as Hermes</span>
    </button>
    <div style="margin-top: 0.85rem; text-align: center;">
      <button type="button" onclick="openResetModal()" style="background:none; border:none; color:var(--accent-light); font-size:0.75rem; text-decoration:underline; cursor:pointer; opacity:0.85;">
        Forgot PIN or Password? Reset via Phone or Email
      </button>
    </div>
    <p id="status"></p>
  </form>

  <div class="footer-badge" id="custom-note">Secure Workstation • RTX 5070 Local Engine</div>
</main>

<!-- Reset Modal -->
<div id="reset-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); backdrop-filter:blur(10px); z-index:100; align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#0d2218; border:1px solid #1b432f; border-radius:24px; max-width:420px; width:100%; padding:1.75rem; text-align:left; color:#f0fdf4; box-shadow:0 25px 50px -12px rgba(0,0,0,0.9); position:relative;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:0.75rem;">
      <h3 style="font-size:1rem; font-weight:700; color:#fff;">🔑 Reset PIN or Password</h3>
      <button type="button" onclick="closeResetModal()" style="background:transparent; border:none; color:#9ca3af; font-size:1.1rem; cursor:pointer;">✕</button>
    </div>

    <!-- Step 1: Request -->
    <div id="reset-step-1">
      <div class="form-group">
        <label>Account Profile</label>
        <input type="text" id="reset-profile" placeholder="Hermes" value="Hermes" required>
      </div>
      <div class="form-group">
        <label>Recovery Method</label>
        <div style="display:flex; gap:0.5rem; margin-top:0.25rem;">
          <button type="button" id="btn-method-email" onclick="setResetMethod('email')" style="flex:1; padding:0.6rem; border-radius:10px; border:1px solid var(--accent); background:rgba(16,185,129,0.2); color:#fff; font-size:0.78rem; font-weight:600; cursor:pointer;">📧 Email Address</button>
          <button type="button" id="btn-method-sms" onclick="setResetMethod('sms')" style="flex:1; padding:0.6rem; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.4); color:#9ca3af; font-size:0.78rem; font-weight:600; cursor:pointer;">📱 Phone (SMS)</button>
        </div>
      </div>
      <div class="form-group">
        <label id="reset-dest-label">Recovery Email Address</label>
        <input type="text" id="reset-dest" placeholder="you@example.com" required>
      </div>
      <button type="button" onclick="requestResetCode()" class="submit-btn" id="btn-send-code">Send 6-Digit Code</button>
    </div>

    <!-- Step 2: Verify -->
    <div id="reset-step-2" style="display:none;">
      <p style="font-size:0.8rem; color:#6ee7b7; margin-bottom:1rem;" id="reset-code-sent-msg"></p>
      <div id="reset-dev-code-banner" style="display:none; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.4); padding:0.5rem; border-radius:8px; font-size:0.8rem; color:#fde68a; margin-bottom:1rem; font-family:monospace;"></div>
      <div class="form-group">
        <label>6-Digit Verification Code</label>
        <input type="text" id="reset-code" maxlength="6" placeholder="123456" style="text-align:center; letter-spacing:0.3em; font-size:1.2rem; font-weight:bold; font-family:monospace;" required>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button type="button" onclick="showResetStep(1)" style="padding:0.75rem 1rem; border-radius:12px; background:rgba(255,255,255,0.1); border:none; color:#e5e7eb; cursor:pointer; font-size:0.85rem;">Back</button>
        <button type="button" onclick="verifyResetCode()" class="submit-btn" style="flex:1;" id="btn-verify-code">Verify Code</button>
      </div>
    </div>

    <!-- Step 3: New PIN / Password -->
    <div id="reset-step-3" style="display:none;">
      <div class="form-group">
        <label>Security Format</label>
        <div style="display:flex; gap:0.5rem; margin-top:0.25rem;">
          <button type="button" id="btn-type-pin" onclick="setNewAuthType('pin')" style="flex:1; padding:0.5rem; border-radius:10px; border:1px solid var(--accent); background:rgba(16,185,129,0.2); color:#fff; font-size:0.75rem; font-weight:600; cursor:pointer;">PIN (Digits)</button>
          <button type="button" id="btn-type-pwd" onclick="setNewAuthType('password')" style="flex:1; padding:0.5rem; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.4); color:#9ca3af; font-size:0.75rem; font-weight:600; cursor:pointer;">Password (Text)</button>
        </div>
      </div>
      <div class="form-group">
        <label id="new-cred-label">New PIN Code</label>
        <input type="password" id="new-cred" placeholder="Enter new PIN" required>
      </div>
      <div class="form-group">
        <label>Confirm PIN / Password</label>
        <input type="password" id="confirm-cred" placeholder="Re-enter new PIN" required>
      </div>
      <button type="button" onclick="completeReset()" class="submit-btn" id="btn-save-cred">Save & Unlock</button>
    </div>

    <p id="reset-status" style="font-size:0.8rem; color:#f87171; margin-top:0.85rem; min-height:1.2rem;"></p>
  </div>
</div>

<script>
let selectedProfileName = 'Hermes';
let availableProfileNames = ['Hermes'];

function updateClock() {
  const now = new Date();
  let custom = {};
  try {
    const saved = localStorage.getItem('Doshie_gui_customization');
    if (saved) custom = JSON.parse(saved);
  } catch(e) {}

  const is24h = custom.lockScreenClockFormat === '24h';
  document.getElementById('clock').textContent = now.toLocaleTimeString([], {
    hour: is24h ? '2-digit' : 'numeric',
    minute: '2-digit',
    second: '2-digit',
    hour12: !is24h
  });
  document.getElementById('date').textContent = now.toLocaleDateString([], {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}
setInterval(updateClock, 1000);
updateClock();

// Apply custom branding from LocalStorage
try {
  const saved = localStorage.getItem('Doshie_gui_customization');
  if (saved) {
    const c = JSON.parse(saved);
    if (c.lockScreenTitle) document.getElementById('custom-title').textContent = c.lockScreenTitle;
    if (c.lockScreenSubtitle) document.getElementById('custom-subtitle').textContent = c.lockScreenSubtitle;
    if (c.lockScreenCustomNote) document.getElementById('custom-note').textContent = c.lockScreenCustomNote;
    if (c.assistantEmoji) document.getElementById('title-text').querySelector('span').textContent = c.assistantEmoji;
  }
} catch(e) {}

// Fetch profiles
async function loadProfiles() {
  try {
    const res = await fetch('/profiles', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        availableProfileNames = data.map(p => p.name);
        const cont = document.getElementById('profiles-container');
        const dl = document.getElementById('profile-suggestions');
        cont.innerHTML = '';
        dl.innerHTML = '';

        data.forEach(p => {
          // Chips
          const chip = document.createElement('div');
          chip.className = 'profile-chip' + (p.name.toLowerCase() === selectedProfileName.toLowerCase() ? ' active' : '');
          chip.onclick = () => selectProfile(p.name);
          chip.innerHTML = `<div class="avatar">${p.name.charAt(0).toUpperCase()}</div><span>${p.name}</span>`;
          cont.appendChild(chip);

          // Datalist
          const opt = document.createElement('option');
          opt.value = p.name;
          dl.appendChild(opt);
        });
      }
    }
  } catch(e) {}
}
loadProfiles();

function updateButtonLabel(name) {
  const clean = name.trim() || 'Guest';
  document.getElementById('btn-text').textContent = `Unlock as ${clean}`;
}

function selectProfile(name) {
  selectedProfileName = name;
  document.getElementById('profile').value = name;
  updateButtonLabel(name);
  document.querySelectorAll('.profile-chip').forEach(c => {
    c.classList.toggle('active', c.querySelector('span').textContent.toLowerCase() === name.toLowerCase());
  });
  document.getElementById('status').textContent = '';
  document.getElementById('credential').focus();
}

function handleProfileInput(typed) {
  selectedProfileName = typed.trim() || 'Hermes';
  updateButtonLabel(typed);
  document.querySelectorAll('.profile-chip').forEach(c => {
    c.classList.toggle('active', c.querySelector('span').textContent.toLowerCase() === typed.trim().toLowerCase());
  });
  document.getElementById('status').textContent = '';
}

function togglePasswordVisibility() {
  const cred = document.getElementById('credential');
  if (cred.type === 'password') {
    cred.type = 'text';
  } else {
    cred.type = 'password';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const prof = document.getElementById('profile').value.trim() || selectedProfileName || 'Hermes';
  const cred = document.getElementById('credential').value.trim();
  const status = document.getElementById('status');
  status.className = '';

  if (!cred) {
    status.className = 'error';
    status.textContent = 'Please enter your PIN or password to unlock.';
    return;
  }

  status.textContent = 'Verifying credentials...';

  try {
    const r = await fetch('/family-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: prof, credential: cred })
    });
    const d = await r.json();
    if (d.ok) {
      status.className = 'success';
      status.textContent = `Welcome back, ${prof}! Loading workstation...`;
      localStorage.setItem('Doshie_active_profile', prof);
      setTimeout(() => { location.href = '/'; }, 300);
    } else {
      status.className = 'error';
      status.textContent = d.error || 'Login failed. Please check your PIN or password.';
    }
  } catch (err) {
    status.className = 'error';
    status.textContent = 'Unable to connect to authentication server.';
  }
}

// Reset Password / PIN Functions
let currentResetMethod = 'email';
let currentNewAuthType = 'pin';
let currentResetToken = '';

function openResetModal() {
  const prof = document.getElementById('profile').value.trim() || selectedProfileName || 'Hermes';
  document.getElementById('reset-profile').value = prof;
  document.getElementById('reset-status').textContent = '';
  document.getElementById('reset-dest').value = '';
  document.getElementById('reset-code').value = '';
  document.getElementById('new-cred').value = '';
  document.getElementById('confirm-cred').value = '';
  currentResetToken = '';
  setResetMethod('email');
  setNewAuthType('pin');
  showResetStep(1);
  document.getElementById('reset-modal').style.display = 'flex';
}

function closeResetModal() {
  document.getElementById('reset-modal').style.display = 'none';
}

function setResetMethod(method) {
  currentResetMethod = method;
  const emailBtn = document.getElementById('btn-method-email');
  const smsBtn = document.getElementById('btn-method-sms');
  const destLabel = document.getElementById('reset-dest-label');
  const destInput = document.getElementById('reset-dest');

  if (method === 'email') {
    emailBtn.style.background = 'rgba(16,185,129,0.2)';
    emailBtn.style.borderColor = 'var(--accent)';
    emailBtn.style.color = '#fff';
    smsBtn.style.background = 'rgba(0,0,0,0.4)';
    smsBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    smsBtn.style.color = '#9ca3af';
    destLabel.textContent = 'Recovery Email Address';
    destInput.type = 'email';
    destInput.placeholder = 'you@example.com';
  } else {
    smsBtn.style.background = 'rgba(16,185,129,0.2)';
    smsBtn.style.borderColor = 'var(--accent)';
    smsBtn.style.color = '#fff';
    emailBtn.style.background = 'rgba(0,0,0,0.4)';
    emailBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    emailBtn.style.color = '#9ca3af';
    destLabel.textContent = 'Recovery Phone Number (with country code)';
    destInput.type = 'tel';
    destInput.placeholder = '+15551234567';
  }
}

function setNewAuthType(type) {
  currentNewAuthType = type;
  const pinBtn = document.getElementById('btn-type-pin');
  const pwdBtn = document.getElementById('btn-type-pwd');
  const credLabel = document.getElementById('new-cred-label');
  const credInput = document.getElementById('new-cred');
  const confInput = document.getElementById('confirm-cred');

  if (type === 'pin') {
    pinBtn.style.background = 'rgba(16,185,129,0.2)';
    pinBtn.style.borderColor = 'var(--accent)';
    pinBtn.style.color = '#fff';
    pwdBtn.style.background = 'rgba(0,0,0,0.4)';
    pwdBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    pwdBtn.style.color = '#9ca3af';
    credLabel.textContent = 'New PIN Code (Digits)';
    credInput.placeholder = 'e.g. 1234';
    confInput.placeholder = 'Re-enter PIN';
  } else {
    pwdBtn.style.background = 'rgba(16,185,129,0.2)';
    pwdBtn.style.borderColor = 'var(--accent)';
    pwdBtn.style.color = '#fff';
    pinBtn.style.background = 'rgba(0,0,0,0.4)';
    pinBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    pinBtn.style.color = '#9ca3af';
    credLabel.textContent = 'New Password';
    credInput.placeholder = 'Enter new password';
    confInput.placeholder = 'Re-enter password';
  }
}

function showResetStep(step) {
  document.getElementById('reset-step-1').style.display = step === 1 ? 'block' : 'none';
  document.getElementById('reset-step-2').style.display = step === 2 ? 'block' : 'none';
  document.getElementById('reset-step-3').style.display = step === 3 ? 'block' : 'none';
  document.getElementById('reset-status').textContent = '';
}

async function requestResetCode() {
  const profile = document.getElementById('reset-profile').value.trim() || 'Hermes';
  const dest = document.getElementById('reset-dest').value.trim();
  const status = document.getElementById('reset-status');
  status.textContent = '';

  if (!dest) {
    status.textContent = `Please enter your ${currentResetMethod === 'email' ? 'email' : 'phone number'}.`;
    return;
  }

  const btn = document.getElementById('btn-send-code');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch('/recovery/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile,
        method: currentResetMethod,
        email: currentResetMethod === 'email' ? dest : undefined,
        phone: currentResetMethod === 'sms' ? dest : undefined,
        destination: dest
      })
    });
    const d = await res.json();
    if (res.ok && d.ok) {
      document.getElementById('reset-code-sent-msg').textContent = d.message || `Code sent to ${d.destination || dest}.`;
      const banner = document.getElementById('reset-dev-code-banner');
      if (d.dev_code) {
        banner.style.display = 'block';
        banner.textContent = `Local Verification Code: ${d.dev_code}`;
      } else {
        banner.style.display = 'none';
      }
      showResetStep(2);
    } else {
      status.textContent = d.error || 'Failed to send recovery code.';
    }
  } catch(e) {
    status.textContent = 'Unable to reach recovery service.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send 6-Digit Code';
  }
}

async function verifyResetCode() {
  const profile = document.getElementById('reset-profile').value.trim() || 'Hermes';
  const code = document.getElementById('reset-code').value.trim();
  const status = document.getElementById('reset-status');
  status.textContent = '';

  if (!code || code.length < 6) {
    status.textContent = 'Please enter the 6-digit verification code.';
    return;
  }

  const btn = document.getElementById('btn-verify-code');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const res = await fetch('/recovery/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile, code })
    });
    const d = await res.json();
    if (res.ok && d.ok && d.reset_token) {
      currentResetToken = d.reset_token;
      showResetStep(3);
    } else {
      status.textContent = d.error || 'Invalid or expired verification code.';
    }
  } catch(e) {
    status.textContent = 'Unable to verify code.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify Code';
  }
}

async function completeReset() {
  const profile = document.getElementById('reset-profile').value.trim() || 'Hermes';
  const cred = document.getElementById('new-cred').value.trim();
  const conf = document.getElementById('confirm-cred').value.trim();
  const status = document.getElementById('reset-status');
  status.textContent = '';

  if (!cred) {
    status.textContent = 'Please enter your new PIN or password.';
    return;
  }
  if (cred !== conf) {
    status.textContent = 'Credentials do not match.';
    return;
  }

  const btn = document.getElementById('btn-save-cred');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch('/recovery/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        profile,
        auth_type: currentNewAuthType,
        credential: cred,
        reset_token: currentResetToken
      })
    });
    const d = await res.json();
    if (res.ok && d.ok) {
      status.style.color = '#34d399';
      status.textContent = 'Reset successful! Loading workstation...';
      localStorage.setItem('Doshie_active_profile', profile);
      setTimeout(() => { location.href = '/'; }, 800);
    } else {
      status.textContent = d.error || 'Failed to update credentials.';
    }
  } catch(e) {
    status.textContent = 'Unable to complete password reset.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save & Unlock';
  }
}
</script>
