<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doshie Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 100vh; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    header { padding: 1rem 1.5rem; background: #0f172a; border-bottom: 1px solid #334155; font-weight: 600; font-size: 1.1rem; }
    .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 80%; padding: 0.75rem 1rem; border-radius: 8px; line-height: 1.4; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.bot { align-self: flex-start; background: #334155; color: #f8fafc; }
    .input-area { display: flex; padding: 1rem; background: #0f172a; border-top: 1px solid #334155; gap: 0.5rem; }
    input { flex: 1; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    button { padding: 0.75rem 1.25rem; background: #2563eb; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>Doshie AI Assistant</header>
    <div class="messages" id="messages">
      <div class="msg bot">Hello Hermes! Doshie is online and ready.</div>
    </div>
    <form class="input-area" id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message or prompt..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('messages');

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.textContent = text;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        appendMessage(data.reply, 'bot');
      } catch (err) {
        appendMessage('Error: Unable to reach Doshie server.', 'bot');
      }
    });
  </script>
</body>
</html>
