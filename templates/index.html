<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#5c8f73">
  <title>Doshie</title>
  <link rel="stylesheet" href="/static/Doshie-app.css">
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --page: #181a19;
      --surface: #212422;
      --surface-soft: #292c2a;
      --surface-hover: #323633;
      --text: #f2f4f2;
      --muted: #a7ada9;
      --line: #3a3e3b;
      --accent: #68a985;
      --accent-strong: #7ab894;
      --user: #294338;
      --shadow: 0 14px 40px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    /* Layout */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    /* Sidebar */
    .sidebar {
      width: 264px;
      height: 100%;
      background: var(--surface-soft);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 14px;
      flex-shrink: 0;
      transition: transform .22s ease;
      z-index: 30;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 1.3rem;
      box-shadow: var(--shadow);
    }
    .new-chat {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s;
    }
    .new-chat:hover {
      background: var(--surface-hover);
    }
    .sidebar-label {
      padding: 6px 8px 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .side-actions {
      display: grid;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
    }
    .side-action {
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 13.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s;
    }
    .side-action:hover {
      background: var(--surface-hover);
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 10px 8px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* Main App Area */
    .app {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface);
    }
    /* Header */
    .header {
      min-height: 60px;
      padding: 10px 24px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .header small {
      color: var(--muted);
      font-size: 12px;
    }
    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    /* Tools row */
    .tools {
      display: flex;
      gap: 7px;
      padding: 9px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tools::-webkit-scrollbar { display: none; }
    .tool {
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tool:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
    }
    /* Messages Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 24px 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scroll-behavior: smooth;
    }
    .messages-list {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg-row {
      display: flex;
      width: 100%;
      gap: 10px;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.bot {
      justify-content: flex-start;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 14.5px;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .msg-row.user .message {
      background: var(--user);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .message {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    /* Markdown within Bot messages */
    .message p { margin-bottom: 0.65rem; }
    .message p:last-child { margin-bottom: 0; }
    .message h1, .message h2, .message h3 {
      margin-top: 0.9rem;
      margin-bottom: 0.45rem;
      color: var(--accent-strong);
    }
    .message ul, .message ol {
      margin-left: 1.4rem;
      margin-bottom: 0.65rem;
    }
    .message li { margin-bottom: 0.2rem; }
    .message code:not(pre code) {
      background: var(--surface-hover);
      color: var(--accent-strong);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: ui-monospace, monospace;
    }
    .code-container {
      position: relative;
      margin: 0.75rem 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.75rem;
      background: #141715;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: monospace;
      border-bottom: 1px solid var(--line);
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      color: #fff;
      background: var(--surface-soft);
    }
    .code-container pre {
      margin: 0 !important;
      padding: 0.85rem !important;
      background: #141715 !important;
      overflow-x: auto;
    }
    .code-container pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    /* Typing Indicator */
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      width: fit-content;
      margin-left: 8px;
      margin-bottom: 8px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    /* Floating Composer */
    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 24px max(20px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, transparent 0%, var(--surface) 28%);
      pointer-events: none;
    }
    .composer {
      width: 100%;
      max-width: 820px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 6px 8px 6px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .composer textarea {
      flex: 1;
      background: transparent;
      border: 0;
      color: var(--text);
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.4;
      max-height: 140px;
      min-height: 24px;
      padding: 8px 0;
    }
    .composer button.send {
      border: 0;
      border-radius: 20px;
      padding: 8px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    .composer button.send:hover:not(:disabled) {
      background: var(--accent-strong);
      transform: scale(1.02);
    }
    .composer button.send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Real Doshie Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">🦕</span>
        <span>Doshie</span>
      </div>
      <button class="new-chat" id="new-chat-btn">
        <span>+</span>
        <span>New Chat</span>
      </button>
      <div class="sidebar-label">Capabilities</div>
      <div class="side-actions">
        <button class="side-action" onclick="quickPrompt('Summarize our recent conversation')">🧠 Memory</button>
        <button class="side-action" onclick="quickPrompt('What tools and commands can you run on Kali Linux?')">⚡ System Tools</button>
        <button class="side-action" onclick="quickPrompt('Check system health and Kali Linux diagnostics')">📊 Health & Stats</button>
        <button class="side-action" onclick="quickPrompt('Help me write a cybersecurity Python script')">🐍 Python Dev</button>
      </div>
      <div class="sidebar-foot">
        <span id="host-label">Hermeskali</span>
        <span id="uptime-label">Online</span>
      </div>
    </aside>

    <!-- Main App Frame -->
    <main class="app">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1>Doshie</h1>
          <small>Personal AI Assistant</small>
        </div>
        <div class="model-badge">
          <span class="dot"></span>
          <span id="active-model">gemini-3.8-flash</span>
        </div>
      </header>

      <!-- Authentic Doshie Tools Row -->
      <div class="tools">
        <div class="tool" onclick="quickPrompt('Show available tools')">⚡ Tools</div>
        <div class="tool" onclick="quickPrompt('Show current memory')">🧠 Memory</div>
        <div class="tool" onclick="quickPrompt('List latest tech news')">📰 News</div>
        <div class="tool" onclick="quickPrompt('Check system status and resource usage')">📊 Status</div>
        <div class="tool" onclick="quickPrompt('Clear session preferences')">⚙️ Settings</div>
      </div>

      <!-- Messages Stream -->
      <div class="messages-container" id="scroll-container">
        <div class="messages-list" id="messages">
          <div class="msg-row bot">
            <div class="message">
              Hello Hermes! Doshie is online and running locally on Kali Linux with <strong>Gemini 3.8 Flash</strong>. How can I help you today?
            </div>
          </div>
        </div>
      </div>

      <div class="typing-indicator" id="typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>

      <!-- Floating Composer -->
      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea id="user-input" placeholder="Message Doshie... (Enter to send, Shift+Enter for newline)" rows="1" required></textarea>
          <button type="submit" class="send" id="send-btn">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('messages');
    const scrollContainer = document.getElementById('scroll-container');
    const typing = document.getElementById('typing');
    const sendBtn = document.getElementById('send-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const activeModel = document.getElementById('active-model');
    const hostLabel = document.getElementById('host-label');
    const uptimeLabel = document.getElementById('uptime-label');

    // Auto-resize input
    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        if (data.model) activeModel.textContent = data.model;
        if (data.host) hostLabel.textContent = data.host;
        if (data.uptime) uptimeLabel.textContent = data.uptime.replace('up ', '');
      } catch (_) {}
    }
    loadStats();

    newChatBtn.addEventListener('click', async () => {
      if (!confirm('Start a fresh Doshie chat?')) return;
      try {
        await fetch('/api/reset', { method: 'POST' });
        messages.innerHTML = `
          <div class="msg-row bot">
            <div class="message">Fresh session started. What can I do for you?</div>
          </div>
        `;
      } catch (_) {}
    });

    function quickPrompt(text) {
      input.value = text;
      form.dispatchEvent(new Event('submit'));
    }

    function renderMarkdown(rawText) {
      const html = marked.parse(rawText);
      const temp = document.createElement('div');
      temp.innerHTML = html;

      temp.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        const lang = code ? (code.className.match(/language-(\w+)/) || [, 'code'])[1] : 'code';

        const container = document.createElement('div');
        container.className = 'code-container';

        const header = document.createElement('div');
        header.className = 'code-header';
        header.innerHTML = `<span>${lang}</span><button class="copy-btn">Copy</button>`;

        const copyBtn = header.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
          });
        });

        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);

        if (code) hljs.highlightElement(code);
      });

      return temp.innerHTML;
    }

    function appendMessage(content, sender, isRaw = false) {
      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      const bubble = document.createElement('div');
      bubble.className = 'message';

      if (sender === 'bot' && !isRaw) {
        bubble.innerHTML = renderMarkdown(content);
      } else {
        bubble.textContent = content;
      }

      row.appendChild(bubble);
      messages.appendChild(row);
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';

      sendBtn.disabled = true;
      typing.style.display = 'flex';
      scrollContainer.scrollTop = scrollContainer.scrollHeight;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        if (data.model) activeModel.textContent = data.model;
        appendMessage(data.reply || 'No reply.', 'bot');
      } catch (err) {
        appendMessage('⚠️ Unable to connect to Doshie backend.', 'bot', true);
      } finally {
        typing.style.display = 'none';
        sendBtn.disabled = false;
        input.focus();
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
